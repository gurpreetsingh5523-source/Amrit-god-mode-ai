[tool.ruff]
exclude = ["workspace"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pinned: newer ruff releases widen the default rule set
ignore = [
    "F401",  # Unused imports (intentional fallback testing)
    "F841",  # Unused variables
    "E702",  # Semicolon statement separation
    "E401",  # Multiple imports on one line
    "F811",  # Redefinition of unused name
    "E402",  # Module-level import not at top of file
    "E701",  # Multiple statements on one line (colon)
    "E741",  # Ambiguous variable name
]

[tool.pytest.ini_options]
norecursedirs = ["workspace", ".venv", ".git"]


